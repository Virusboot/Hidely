allprojects {
    repositories {
        google()
        mavenCentral()
    }
    repositories.metaClass.jcenter = {
        return mavenCentral()
    }
    ext.flutter = [
        compileSdkVersion: 36,
        targetSdkVersion: 36,
        minSdkVersion: 24,
        ndkVersion: "27.0.12077973"
    ]
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
    tasks.withType(JavaCompile) {
        options.compilerArgs.remove("-Werror")
        options.compilerArgs << "-Xlint:-options"
    }
    tasks.whenTaskAdded { task ->
        if (task.name.contains("verifyReleaseResources") || task.name.contains("verifyDebugResources") || task.name.contains("lintVital")) {
            task.enabled = false
        }
    }
    project.plugins.withId("com.android.library") {
        project.android.compileSdkVersion 36
        if (project.android.namespace == null) {
            def manifestFile = project.file("src/main/AndroidManifest.xml")
            if (manifestFile.exists()) {
                def content = manifestFile.text
                def matcher = (content =~ /package="([^"]+)"/)
                if (matcher.find()) {
                    project.android.namespace = matcher.group(1)
                } else {
                    project.android.namespace = "dev.isar." + project.name.replaceAll("-", "_")
                }
            } else {
                project.android.namespace = "dev.isar." + project.name.replaceAll("-", "_")
            }
        }
    }
}

subprojects {
    project.configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}


