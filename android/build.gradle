allprojects {
    repositories {
        google()
        mavenCentral()
    }
    ext.flutter = [
        compileSdkVersion: 34,
        targetSdkVersion: 34,
        minSdkVersion: 21,
        ndkVersion: "25.1.8937393"
    ]
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
    tasks.withType(JavaCompile) {
        options.compilerArgs.remove("-Werror")
        options.compilerArgs << "-Xlint:-options"
    }
    project.plugins.whenPluginAdded { plugin ->
        if (plugin.class.name.startsWith("com.android.build.gradle.LibraryPlugin") || 
            plugin.class.name.startsWith("com.android.build.gradle.AppPlugin")) {
            def manifestFile = project.file("src/main/AndroidManifest.xml")
            if (manifestFile.exists()) {
                def content = manifestFile.text
                def matcher = (content =~ /package="([^"]+)"/)
                if (matcher.find()) {
                    def pkgName = matcher.group(1)
                    project.android {
                        if (namespace == null) {
                            namespace = pkgName
                        }
                    }
                    manifestFile.text = content.replaceAll(/package="[^"]*"/, '')
                } else {
                    project.android {
                        if (namespace == null) {
                            namespace = "dev.isar." + project.name.replaceAll("-", "_")
                        }
                    }
                }
            } else {
                project.android {
                    if (namespace == null) {
                        namespace = "dev.isar." + project.name.replaceAll("-", "_")
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
